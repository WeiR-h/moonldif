name: Verify MoonLDIF
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MOONBIT_INSTALL_VERSION: 0.10.11+6ff76a5f9
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install official MoonBit toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install official MoonBit toolchain (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify core, CLI and scenarios
        run: node scripts/verify.mjs
      - name: Compare exact released baseline outputs
        run: python scripts/baseline-verify.py
      - name: Observe performance without shared-runner timing thresholds
        run: node scripts/benchmark.mjs
      - name: Install locked workbench dependencies
        run: npm --prefix web ci
      - name: Build browser workbench with the MoonBit core
        run: npm --prefix web run build
      - name: Verify packaged library from a fresh consumer workspace
        run: python scripts/package-verify.py
      - name: Compare with independent parser
        run: python scripts/reference-verify.py
      - name: Compare snapshot results with independent parser and generated models
        run: python scripts/snapshot-verify.py
      - name: Verify pinned unmodified OpenLDAP fixtures
        run: python scripts/openldap-verify.py
      - name: Compare all change types with independent LDAP SDK
        run: python scripts/sdk-verify.py
      - name: Verify published RFC examples and documented variants
        run: python scripts/rfc-verify.py
      - name: Prepare pinned ecosystem dependencies
        run: python scripts/test_pinned_download.py
      - name: Download verified ecosystem dependencies
        run: python scripts/prepare-moonldap.py
      - name: Verify offline moonldap mapping
        run: node scripts/test-moonldap.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: verification/local/
  browser:
    runs-on: ubuntu-latest
    env:
      MOONBIT_INSTALL_VERSION: 0.10.11+6ff76a5f9
      PAGES_BASE: /moonldif/
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install official MoonBit
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: node web/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Verify browser workflows on Pages subpath
        run: |
          npm --prefix web run preview -- --port 4188 > /tmp/moonldif-preview.log 2>&1 &
          node --input-type=module -e "for(let n=0;n<40;n++){try{if((await fetch('http://127.0.0.1:4188/moonldif/')).ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,500))}process.exit(1)"
          node scripts/browser-verify.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: verification/local/browser-local/
  pages-build:
    needs: [verify, browser]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    env:
      MOONBIT_INSTALL_VERSION: 0.10.11+6ff76a5f9
      PAGES_BASE: /moonldif/
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Require exact stable package tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v)||process.env.RELEASE_TAG!=='v'+v)process.exit(1)"
      - name: Install official MoonBit
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified stable version
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
